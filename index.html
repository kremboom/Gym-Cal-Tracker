<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30-Day Physique Recomp Tracker</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 1rem;
            max-width: 900px;
            margin: 0 auto;
            padding-bottom: 3rem;
        }

        header {
            text-align: center;
            padding: 1.5rem 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--accent);
            margin-bottom: 0.25rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Nav Tabs */
        .nav-tabs {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        /* Tab Content */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Cards */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.2rem;
            border: 1px solid var(--border);
            margin-bottom: 1.2rem;
        }

        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Day & Split Selector */
        .day-selector {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 0.5rem;
        }

        .day-selector select, .day-selector input {
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.6rem;
            border-radius: 6px;
            font-size: 0.95rem;
            margin-bottom: 0;
        }

        /* Workout Split Selector Pills */
        .split-pills {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.2rem;
        }

        .pill {
            flex: 1;
            padding: 0.5rem;
            text-align: center;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--text-muted);
            cursor: pointer;
        }

        .pill.active {
            background: rgba(56, 189, 248, 0.15);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Workout Routine Table/List */
        .routine-list {
            list-style: none;
        }

        .routine-item {
            background: var(--bg-color);
            border: 1px solid var(--border);
            padding: 0.9rem;
            border-radius: 8px;
            margin-bottom: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .exercise-info h4 {
            font-size: 1rem;
            color: var(--text-main);
            margin-bottom: 0.2rem;
        }

        .exercise-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .set-badge {
            display: inline-block;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--accent);
            font-size: 0.75rem;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            margin-left: 0.3rem;
        }

        .weight-input-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .weight-input-group input {
            width: 80px;
            padding: 0.5rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>30-Day Physique Recomp</h1>
        <p>5'8" | 152 lbs | Target: 2,200 kcal | 150g Protein</p>
    </header>

    <!-- Navigation -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('workout')">Gym Routine</button>
        <button class="tab-btn" onclick="switchTab('analytics')">Strength & Weight Analytics</button>
    </div>

    <!-- Active Day & Body Weight Tracker Header -->
    <div class="card">
        <div class="day-selector">
            <div style="flex: 1;">
                <label style="font-size:0.75rem; color:var(--text-muted); display:block; margin-bottom:0.2rem;">Select Day:</label>
                <select id="activeDaySelect" style="width: 100%;" onchange="changeActiveDay()"></select>
            </div>
            <div style="flex: 1;">
                <label style="font-size:0.75rem; color:var(--text-muted); display:block; margin-bottom:0.2rem;">Body Weight (lbs):</label>
                <input type="number" id="bodyWeightInput" style="width: 100%;" placeholder="152" onchange="saveBodyWeight()">
            </div>
        </div>
    </div>

    <!-- TAB 1: GYM ROUTINE -->
    <div id="workout" class="tab-content active">
        <div class="card">
            <h2>
                <span id="workoutSplitTitle">Push Day Routine</span>
                <span style="font-size:0.8rem; color:var(--text-muted); font-weight:normal;">Target: 10 Reps / Set</span>
            </h2>

            <!-- Split Selector Pills -->
            <div class="split-pills">
                <div id="pill-push" class="pill" onclick="setSplit('Push')">Push (Chest/Shoulders/Triceps)</div>
                <div id="pill-pull" class="pill" onclick="setSplit('Pull')">Pull (Back/Biceps)</div>
                <div id="pill-legs" class="pill" onclick="setSplit('Legs')">Legs & Core</div>
            </div>

            <ul id="routineList" class="routine-list"></ul>
        </div>
    </div>

    <!-- TAB 2: STRENGTH & WEIGHT ANALYTICS -->
    <div id="analytics" class="tab-content">
        <div class="card">
            <h2>Body Weight Trend (30 Days)</h2>
            <div style="height: 250px; position: relative;">
                <canvas id="weightChart"></canvas>
            </div>
        </div>

        <div class="card">
            <h2>Strength Progress (Working Weight Tracker)</h2>
            <div style="height: 280px; position: relative;">
                <canvas id="strengthChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Preset Workout Splits with Optimal Science-Backed Hypertrophy Sets & 10 Rep Targets
        const splitTemplates = {
            Push: [
                { name: "Barbell / Dumbbell Bench Press", sets: 4 },
                { name: "Incline Dumbbell Press", sets: 3 },
                { name: "Overhead Dumbbell Shoulder Press", sets: 3 },
                { name: "Cable / Dumbbell Lateral Raises", sets: 4 },
                { name: "Tricep Rope Pushdowns", sets: 3 }
            ],
            Pull: [
                { name: "Lat Pulldown / Pull-ups", sets: 4 },
                { name: "Barbell / Chest-Supported Rows", sets: 4 },
                { name: "Face Pulls / Rear Delt Flyes", sets: 3 },
                { name: "Barbell / Dumbbell Bicep Curls", sets: 3 },
                { name: "Hammer Curls", sets: 3 }
            ],
            Legs: [
                { name: "Barbell Squats / Leg Press", sets: 4 },
                { name: "Romanian Deadlifts (RDLs)", sets: 3 },
                { name: "Leg Extensions", sets: 3 },
                { name: "Hamstring Lying Leg Curls", sets: 3 },
                { name: "Standing Calf Raises", sets: 4 },
                { name: "Hanging Leg Raises / Ab Curls", sets: 3 }
            ]
        };

        let activeDay = 1;
        let trackerData = JSON.parse(localStorage.getItem('recompTrackerDataSplit')) || {};

        // Auto-assign Split based on Day number (Push -> Pull -> Legs rotation)
        function getDefaultSplitForDay(dayNum) {
            const rem = (dayNum - 1) % 3;
            if (rem === 0) return 'Push';
            if (rem === 1) return 'Pull';
            return 'Legs';
        }

        // Initialize 30 Days Structure
        for (let i = 1; i <= 30; i++) {
            if (!trackerData[i]) {
                const daySplit = getDefaultSplitForDay(i);
                trackerData[i] = {
                    bodyWeight: 152,
                    split: daySplit,
                    exercises: splitTemplates[daySplit].map(ex => ({ ...ex, weight: 0 }))
                };
            }
        }

        let weightChartInstance = null;
        let strengthChartInstance = null;

        window.onload = function() {
            populateDaySelector();
            renderActiveDay();
            initCharts();
        };

        function saveData() {
            localStorage.setItem('recompTrackerDataSplit', JSON.stringify(trackerData));
            updateCharts();
        }

        function populateDaySelector() {
            const select = document.getElementById('activeDaySelect');
            select.innerHTML = '';
            for (let i = 1; i <= 30; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.innerText = `Day ${i}`;
                select.appendChild(opt);
            }
            select.value = activeDay;
        }

        function changeActiveDay() {
            activeDay = parseInt(document.getElementById('activeDaySelect').value);
            renderActiveDay();
        }

        function setSplit(splitName) {
            trackerData[activeDay].split = splitName;
            // Load template exercises for chosen split if changing
            trackerData[activeDay].exercises = splitTemplates[splitName].map(ex => ({ ...ex, weight: 0 }));
            saveData();
            renderActiveDay();
        }

        function renderActiveDay() {
            const dayData = trackerData[activeDay];
            document.getElementById('bodyWeightInput').value = dayData.bodyWeight || '';

            // Update Pills UI
            document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            const currentSplit = dayData.split || 'Push';
            document.getElementById(`pill-${currentSplit.toLowerCase()}`).classList.add('active');
            document.getElementById('workoutSplitTitle').innerText = `${currentSplit} Day Routine`;

            // Render Exercises
            const listEl = document.getElementById('routineList');
            listEl.innerHTML = '';

            dayData.exercises.forEach((ex, idx) => {
                listEl.innerHTML += `
                    <li class="routine-item">
                        <div class="exercise-info">
                            <h4>${ex.name} <span class="set-badge">${ex.sets} Sets</span></h4>
                            <p>Target Reps: <strong>10</strong></p>
                        </div>
                        <div class="weight-input-group">
                            <input type="number" value="${ex.weight}" placeholder="lbs" onchange="updateWeight(${idx}, this.value)">
                            <span style="font-size:0.85rem; color:var(--text-muted);">lbs</span>
                        </div>
                    </li>
                `;
            });
        }

        function updateWeight(exIndex, val) {
            trackerData[activeDay].exercises[exIndex].weight = parseFloat(val) || 0;
            saveData();
        }

        function saveBodyWeight() {
            const val = parseFloat(document.getElementById('bodyWeightInput').value) || 0;
            trackerData[activeDay].bodyWeight = val;
            saveData();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        // Charts Setup
        function initCharts() {
            const labels = Array.from({length: 30}, (_, i) => `Day ${i+1}`);

            // Body Weight Chart
            const weightCtx = document.getElementById('weightChart').getContext('2d');
            weightChartInstance = new Chart(weightCtx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Body Weight (lbs)',
                        data: getWeightArray(),
                        borderColor: '#38bdf8',
                        backgroundColor: 'rgba(56, 189, 248, 0.1)',
                        fill: true,
                        tension: 0.2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                        x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }
                    },
                    plugins: { legend: { labels: { color: '#f8fafc' } } }
                }
            });

            // Strength Chart
            const strengthCtx = document.getElementById('strengthChart').getContext('2d');
            strengthChartInstance = new Chart(strengthCtx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: getStrengthDatasets()
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                        x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }
                    },
                    plugins: { legend: { labels: { color: '#f8fafc' } } }
                }
            });
        }

        function getWeightArray() {
            let arr = [];
            for (let i = 1; i <= 30; i++) {
                arr.push(trackerData[i] ? trackerData[i].bodyWeight : 152);
            }
            return arr;
        }

        function getStrengthDatasets() {
            // Main compound lifts tracked across days
            let pushWeights = [];
            let pullWeights = [];
            let legWeights = [];

            for (let d = 1; d <= 30; d++) {
                const day = trackerData[d];
                pushWeights.push((day && day.split === 'Push' && day.exercises[0]) ? day.exercises[0].weight : null);
                pullWeights.push((day && day.split === 'Pull' && day.exercises[0]) ? day.exercises[0].weight : null);
                legWeights.push((day && day.split === 'Legs' && day.exercises[0]) ? day.exercises[0].weight : null);
            }

            return [
                { label: 'Bench Press (lbs)', data: pushWeights, borderColor: '#38bdf8', spanGaps: true, tension: 0.2 },
                { label: 'Lat Pulldowns (lbs)', data: pullWeights, borderColor: '#22c55e', spanGaps: true, tension: 0.2 },
                { label: 'Squat / Leg Press (lbs)', data: legWeights, borderColor: '#f59e0b', spanGaps: true, tension: 0.2 }
            ];
        }

        function updateCharts() {
            if (weightChartInstance) {
                weightChartInstance.data.datasets[0].data = getWeightArray();
                weightChartInstance.update();
            }
            if (strengthChartInstance) {
                const updatedDatasets = getStrengthDatasets();
                strengthChartInstance.data.datasets.forEach((ds, i) => {
                    if (updatedDatasets[i]) ds.data = updatedDatasets[i].data;
                });
                strengthChartInstance.update();
            }
        }
    </script>
</body>
</html>
